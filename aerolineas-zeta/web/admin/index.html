<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aerolíneas Zeta | Administració</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <script src="https://unpkg.com/decap-cms@3/dist/decap-cms.js"></script>
  <script>
    (function () {
      const h = window.React.createElement;
      const groups = [
        ['hero', 'Títol principal', 'AEROLÍNEAS ZETA'],
        ['headings', 'Títols de secció', 'BOOTLEGS · MASHUPS'],
        ['subtitles', 'Subtítols i etiquetes', 'GROOVY MIXES SINCE 2007'],
        ['body', 'Textos descriptius', 'Un viatge musical entre indie, pop, rock i electrònica.'],
        ['navigation', 'Menús', 'Bootlegs     Mashups     Mixtapes'],
        ['buttons', 'Botons', 'ESCOLTAR ↗']
      ];
      const allowedFonts = ['Barlow Condensed', 'DM Sans', 'Arial', 'Georgia', 'Verdana'];
      const safeSize = s => typeof s === 'string' && (/^\d+(\.\d+)?(px|rem|em|vw)$/.test(s.trim()) || /^clamp\(\s*\d+(\.\d+)?(px|rem|em|vw)\s*,\s*\d+(\.\d+)?(px|rem|em|vw)\s*,\s*\d+(\.\d+)?(px|rem|em|vw)\s*\)$/.test(s.trim()));
      function Preview(props) {
        const entry = props.entry;
        return h('div', {style: {padding: '24px', fontFamily: 'DM Sans, sans-serif', background: '#f5f3f1', minHeight: '100vh', color: '#201c21'}},
          h('h2', {style: {fontSize: '20px', margin: '0 0 8px'}}, 'Previsualització de tipografia'),
          h('p', {style: {fontSize: '13px', margin: '0 0 22px'}}, 'La mostra s’actualitza quan canvies els camps de l’editor. Les mides molt grans es limiten visualment en aquest panell.'),
          groups.map(function (g) {
            const get = key => entry.getIn(['data', g[0], key]);
            const font = get('font');
            const size = get('size');
            const weight = Number(get('weight'));
            const color = get('color');
            const style = {
              fontFamily: allowedFonts.includes(font) ? '"' + font + '", sans-serif' : 'inherit',
              fontSize: safeSize(size) ? size : '24px',
              fontWeight: Number.isInteger(weight) && weight >= 100 && weight <= 900 ? weight : 400,
              color: typeof color === 'string' && /^#[\da-f]{3,8}$/i.test(color) ? color : '#201c21',
              lineHeight: 1.12, overflowWrap: 'anywhere', margin: 0
            };
            return h('section', {key: g[0], style: {background: '#fff', border: '1px solid #ddd', borderRadius: '10px', padding: '18px', marginBottom: '16px', overflow: 'hidden'}},
              h('div', {style: {fontSize: '12px', fontWeight: 700, marginBottom: '12px', color: '#666'}}, g[1] + ' · ' + (font || 'Font predeterminada')),
              h('div', {style: {maxHeight: '230px', overflow: 'auto'}}, h('p', {style}, g[2]))
            );
          })
        );
      }
      // En una col·lecció de fitxers, el nom de fitxer de config.yml és «typography».
      window.CMS.registerPreviewTemplate('typography', Preview);
    })();
  </script>
</body>
</html>
