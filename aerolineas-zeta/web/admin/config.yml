# Configureu base_url amb un servei OAuth segur abans de fer login.
backend:
  name: github
  repo: aerolineaszetadjs-coder/admin
  branch: proves-cms
  base_url: https://winter-heart-4dcaaerolineas-zeta-cms-auth.aerolineaszetadjs.workers.dev
  auth_endpoint: auth
media_folder: aerolineas-zeta/web/assets
public_folder: /assets
publish: false
collections:
- name: homepage_carousel
  label: Carrusel de vídeos de portada
  files:
  - name: carousel
    label: Vídeos i reproducció
    file: aerolineas-zeta/web/content/carousel.json
    fields:
    - {label: Activar carrusel, name: enabled, widget: boolean, default: false}
    - {label: Títol del bloc, name: heading, widget: string, default: Vídeos}
    - {label: Segons màxims per vídeo, name: seconds_per_video, widget: number, value_type: int, min: 5, max: 120, default: 20}
    - label: Vídeos (arrossega per ordenar)
      name: videos
      widget: list
      collapsed: true
      summary: '{{fields.title}}'
      fields:
      - {label: Títol, name: title, widget: string}
      - {label: Fitxer MP4 o WebM, name: src, widget: file, hint: 'Puja un vídeo optimitzat MP4/WebM. També pots indicar una URL HTTPS directa a un fitxer de vídeo.'}
      - {label: Imatge de portada, name: poster, widget: image, required: false}
- name: design
  label: Disseny i apartats
  files:
  - name: design
    label: Colors i ordre de seccions
    file: aerolineas-zeta/web/content/design.json
    fields:
    - label: Colors globals
      name: colors
      widget: object
      fields:
      - label: pink
        name: pink
        widget: color
      - label: orange
        name: orange
        widget: color
      - label: ink
        name: ink
        widget: color
      - label: paper
        name: paper
        widget: color
    - label: Apartats (visibilitat i ordre)
      name: sections
      widget: list
      summary: '{{fields.label}}'
      fields:
      - label: Identificador (no canviar)
        name: key
        widget: string
      - label: Nom
        name: label
        widget: string
      - label: Visible
        name: visible
        widget: boolean
        default: true
      - label: Ordre
        name: order
        widget: number
        value_type: int
